<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب — SafeID</title>
  <link rel="icon" href="/public/assets/safeid-logo.png" />
  <link rel="manifest" href="/public/manifest.json" />
  <meta name="theme-color" content="#0A2540" />
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/components.css" />
  <link rel="stylesheet" href="/public/css/auth.css" />
  <link rel="stylesheet" href="/public/css/responsive.css" />
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <aside class="auth-side">
      <img src="/public/assets/safeid-logo.png" alt="SafeID" class="auth-logo" />
      <h1>أنشئ حساب SafeID</h1>
      <p>أمانك على بعد مسح واحد.</p>
      <ul class="auth-features">
        <li>✔ رمز QR فريد لكل شخص</li>
        <li>✔ ملف طوارئ آمن</li>
        <li>✔ وصول فوري عند الحاجة</li>
      </ul>
    </aside>

    <main class="auth-main">
      <form id="signupForm" class="auth-form" novalidate>
        <h2>تسجيل المريض</h2>

        <div class="form-row">
          <label>الاسم بالكامل<input type="text" name="fullName" required /></label>
          <label>تاريخ الميلاد<input type="date" name="dob" required /></label>
        </div>

        <div class="form-row">
          <label>الجنس
            <select name="gender" required>
              <option value="">اختر</option>
              <option>ذكر</option><option>أنثى</option><option>آخر</option>
            </select>
          </label>
          <label>فصيلة الدم
            <select name="bloodType" required>
              <option value="">اختر</option>
              <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
            </select>
          </label>
        </div>

        <div class="form-row">
          <label>رقم الهاتف<input type="tel" name="phone" required /></label>
          <label>البريد الإلكتروني<input type="email" name="email" required /></label>
        </div>

        <label>كلمة المرور<input type="password" name="password" minlength="8" required /></label>

        <h3>جهة الاتصال في الطوارئ</h3>
        <div class="form-row">
          <label>اسم جهة الاتصال<input type="text" name="ecName" required /></label>
          <label>رقم جهة الاتصال<input type="tel" name="ecPhone" required /></label>
        </div>

        <h3>المعلومات الطبية</h3>
        <label>الحساسية<input type="text" name="allergies" placeholder="مثال: البنسلين" /></label>
        <label>الحالات المرضية<input type="text" name="conditions" placeholder="مثال: الربو" /></label>
        <label>الأدوية الحالية<input type="text" name="medications" /></label>

        <label>العنوان<input type="text" name="address" /></label>
        <label>الصورة الشخصية<input type="file" name="photo" accept="image/*" /></label>

        <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
        <p class="auth-alt">لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a></p>
        <p class="auth-alt"><a href="/sign-up-parent">التسجيل كولي أمر</a></p>
      </form>
    </main>
  </div>

  <div id="toastRoot"></div>

  <script src="/public/js/config.js"></script>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/ui.js"></script>
  <script src="/public/js/validation.js"></script>
  <script src="/public/js/sign-up.js"></script>
</body>
</html>
