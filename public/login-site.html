<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SafeID</title>
  <link rel="icon" href="/public/assets/safeid-logo.png" />
  <link rel="manifest" href="/public/manifest.json" />
  <meta name="theme-color" content="#0A2540" />
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/components.css" />
  <link rel="stylesheet" href="/public/css/auth.css" />
  <link rel="stylesheet" href="/public/css/responsive.css" />
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <aside class="auth-side">
      <img src="/public/assets/safeid-logo.png" alt="SafeID" class="auth-logo" />
      <h1>Welcome Back</h1>
      <p>Your Safety, One Scan Away.</p>
    </aside>

    <main class="auth-main">
      <form id="loginForm" class="auth-form" novalidate>
        <h2>Patient Login</h2>

        <label>Email<input type="email" name="email" required /></label>
        <label>Password<input type="password" name="password" required /></label>

        <div class="form-inline">
          <label class="checkbox"><input type="checkbox" name="remember" /> Remember me</label>
          <a href="#" class="link-muted" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
        <p class="auth-alt">New here? <a href="/sign-up">Create account</a></p>
        <p class="auth-alt"><a href="/login-parent">Parent Login</a> · <a href="/login-admin">Admin</a></p>
      </form>
    </main>
  </div>

  <div id="toastRoot"></div>

  <script src="/public/js/config.js"></script>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/ui.js"></script>
  <script src="/public/js/login-site.js"></script>
</body>
</html>
