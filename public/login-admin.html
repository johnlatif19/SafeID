<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — SafeID</title>
  <link rel="icon" href="/public/assets/safeid-logo.png" />
  <meta name="theme-color" content="#0A2540" />
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/components.css" />
  <link rel="stylesheet" href="/public/css/auth.css" />
  <link rel="stylesheet" href="/public/css/responsive.css" />
</head>
<body class="auth-body admin-body">
  <div class="auth-wrap">
    <aside class="auth-side admin-side">
      <img src="/public/assets/safeid-logo.png" alt="SafeID" class="auth-logo" />
      <h1>Admin Access</h1>
      <p>Restricted area. Authorized personnel only.</p>
    </aside>

    <main class="auth-main">
      <form id="adminLoginForm" class="auth-form" novalidate>
        <h2>Admin Login</h2>
        <label>Admin Email<input type="email" name="email" required /></label>
        <label>Password<input type="password" name="password" required /></label>
        <button type="submit" class="btn btn-dark btn-block">Login</button>
        <p class="auth-alt link-muted">Secure endpoint · All access is logged.</p>
      </form>
    </main>
  </div>

  <div id="toastRoot"></div>

  <script src="/public/js/config.js"></script>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/ui.js"></script>
  <script src="/public/js/login-admin.js"></script>
</body>
</html>
