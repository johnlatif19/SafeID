<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول ولي الأمر — SafeID</title>
  <link rel="icon" href="/public/assets/safeid-logo.png" />
  <meta name="theme-color" content="#0A2540" />
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/components.css" />
  <link rel="stylesheet" href="/public/css/auth.css" />
  <link rel="stylesheet" href="/public/css/responsive.css" />
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <aside class="auth-side parent-side">
      <img src="/public/assets/safeid-logo.png" alt="SafeID" class="auth-logo" />
      <h1>بوابة أولياء الأمور</h1>
      <p>الوصول إلى ملفات أبنائك.</p>
    </aside>

    <main class="auth-main">
      <form id="parentLoginForm" class="auth-form" novalidate>
        <h2>تسجيل دخول ولي الأمر</h2>
        <label>البريد الإلكتروني<input type="email" name="email" required /></label>
        <label>كلمة المرور<input type="password" name="password" required /></label>
        <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
        <p class="auth-alt">ولي أمر جديد؟ <a href="/sign-up-parent">التسجيل</a></p>
        <p class="auth-alt"><a href="/login">دخول المرضى</a></p>
      </form>
    </main>
  </div>

  <div id="toastRoot"></div>

  <script src="/public/js/config.js"></script>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/ui.js"></script>
  <script src="/public/js/validation.js"></script>
  <script src="/public/js/login-site.js"></script>
</body>
</html>
