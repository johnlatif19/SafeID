<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل ولي الأمر — SafeID</title>
  <link rel="icon" href="/public/assets/safeid-logo.png" />
  <meta name="theme-color" content="#0A2540" />
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/components.css" />
  <link rel="stylesheet" href="/public/css/auth.css" />
  <link rel="stylesheet" href="/public/css/responsive.css" />
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <aside class="auth-side parent-side">
      <img src="/public/assets/safeid-logo.png" alt="SafeID" class="auth-logo" />
      <h1>حساب ولي أمر</h1>
      <p>أدر ملفات SafeID الخاصة بأبنائك.</p>
    </aside>

    <main class="auth-main">
      <form id="parentSignupForm" class="auth-form" novalidate>
        <h2>تسجيل ولي الأمر</h2>

        <label>الاسم بالكامل<input type="text" name="fullName" required /></label>
        <div class="form-row">
          <label>البريد الإلكتروني<input type="email" name="email" required /></label>
          <label>رقم الهاتف<input type="tel" name="phone" required /></label>
        </div>
        <label>كلمة المرور<input type="password" name="password" minlength="8" required /></label>
        <label>صلة القرابة
          <select name="relationship" required>
            <option value="">اختر</option>
            <option>الأم</option><option>الأب</option>
            <option>ولي أمر</option><option>أخرى</option>
          </select>
        </label>

        <button type="submit" class="btn btn-primary btn-block">إنشاء حساب ولي الأمر</button>
        <p class="auth-alt">مسجل بالفعل؟ <a href="/login-parent">تسجيل الدخول</a></p>
      </form>
    </main>
  </div>

  <div id="toastRoot"></div>

  <script src="/public/js/config.js"></script>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/ui.js"></script>
  <script src="/public/js/validation.js"></script>
  <script src="/public/js/sign-up-parent.js"></script>
</body>
</html>
